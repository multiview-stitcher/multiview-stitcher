# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py
isolated_build=true

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
    # pytest builds its temporary directory under the current user's name, and
    # on Windows the only place it can find one is USERNAME - which tox does
    # not pass through by default. Without it `getpass.getuser()` falls back to
    # the `pwd` module, which does not exist there, and every test taking
    # `tmp_path` errors during setup. Python 3.13 turned that into an OSError,
    # which the pinned pytest (<8, see the dev extra) does not catch.
    USERNAME
    USER
extras =
    dev
deps =
    setuptools
commands = pytest \
    -m "not private_data" \
    -v \
    --color=yes \
    --cov=multiview_stitcher \
    --cov-report=xml \
    --nbmake \
    --ignore src/multiview_stitcher/_tests/_create_test_params.ipynb \
    --ignore notebooks/stitching_bigstitcher_multiview.ipynb \
    --ignore notebooks/stitching_mesospim.ipynb \
    --ignore notebooks/stitching_exaspim.ipynb \
    --ignore notebooks/stitching_multipos_2D_czi.ipynb \
    --ignore notebooks/stitching_in_the_browser.ipynb \
    --ignore _playground \
    --ignore notebooks/stitch_and_register_ashlar_example_dataset.ipynb

# multiview-stitcher supports both zarr-python v2 and v3, so that it can be
# installed next to packages that still pin `zarr<3`. This environment holds
# zarr at v2 and runs the same test suite: everything that needs v3 - the
# virtual-array layer and zarr-backed sims, OME-Zarr 0.5, TIFFs read through a
# virtual store, the browser runtime - is marked `zarr_v3_only` and skips, so
# what runs here is the part that has to work under either version (NGFF 0.4
# reading and writing, registration, fusion, io).
#
# Not in `envlist`: `tox` alone tests the default (v3) installation, and CI
# runs this one explicitly with `tox -e zarr2`.
[testenv:zarr2]
platform = linux
passenv = {[testenv]passenv}
extras = dev
deps =
    setuptools
    # The only v2 release that caps numcodecs; earlier ones resolve against
    # numcodecs >=0.16 and then fail to import.
    zarr >=2.18.7,<3
# No --nbmake here: the notebooks are written against the v3 installation.
commands = pytest \
    src/multiview_stitcher/_tests \
    -m "not private_data" \
    -v \
    --color=yes
