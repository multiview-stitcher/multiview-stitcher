[build-system]
requires = [
    "setuptools>=42.0.0",
    "wheel",
    "setuptools_scm"
]
build-backend = "setuptools.build_meta"


[tool.setuptools_scm]
write_to = "src/multiview_stitcher/_version.py"


[project]
name = "multiview-stitcher"
description = "Registration and fusion of large imaging datasets in 2D and 3D."
authors = [
    { name = "Marvin Albert", email = "marvin.albert@gmail.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
]

requires-python = ">=3.11"
dependencies = [
    "numpy >=1.18",
    "dask !=2025.11.0",
    "dask_image",
    "zarr >=3",
    "xarray >=2024.10.0",
    "tifffile >=2022.7.28",
    "networkx",
    "tqdm",
    "matplotlib",
    "scikit-image >=0.21.0",
    "ngff-zarr >=0.12.2",
    "aiohttp"
]
dynamic = [
    "version",
]

[project.license]
text = "BSD 3-Clause"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
"Bug Tracker" = "https://github.com/multiview-stitcher/multiview-stitcher/issues"
Documentation = "https://multiview-stitcher.github.io/multiview-stitcher/"
"Source Code" = "https://github.com/multiview-stitcher/multiview-stitcher"
"User Support" = "https://github.com/multiview-stitcher/multiview-stitcher/issues"


[project.optional-dependencies]
ants = [
    "antspyx >=0.6.0",
]
itk-elastix = [
    "itk-elastix >=0.25.2",
]
# elastix compiled to WebAssembly. This is what makes it available in the
# browser; on CPython it runs through wasmtime and needs no compiler.
itkwasm-elastix = [
    "itkwasm-elastix >=1.0.2",
]
czi = [
    "czifile ==2019.7.2.3",
    "imagecodecs >=2023.7.10",
]
imaris = [
    "h5py",
]
dev = [
    "tox",
    "jupyter",
    "pytest <8.0.0",  # https://github.com/pytest-dev/pytest/issues/11779
    "pytest-cov",  # https://pytest-cov.readthedocs.io/en/latest/
    "pytest-benchmark >5",
    "nbmake",  # notebook testing
    "antspyx >=0.6.0",
    "itk-elastix >=0.25.2",
    "itkwasm-elastix >=1.0.2",
    "czifile ==2019.7.2.3",
    "h5py",
    "imagecodecs >=2023.7.10",
    "pre-commit",
]
playground = [
    "napari-stitcher",
    "napari[pyqt6, optional]",
    "napari-ome-zarr",
    "pydantic_bigstitcher>=0.0.11",
    "ipympl",
    "ome-types",
    "ipyfilechooser>=0.6.0",
    "joblib",
    "h5py",
    "lxml",
    "xmltodict",
]
browser = [
    # Versions installable in Pyodide, matching docs/browser/config.json.
    # ngff-zarr and zarr v3 both work there, so the NGFF reader, the NGFF
    # writer and the zarr library are the same code in the browser as on
    # CPython. Note that zarr must come from Pyodide's own package index:
    # its build blocks by suspending the WebAssembly stack, and the PyPI
    # wheel of the same version starts a thread instead.
    "dask[array] ==2025.2.0",
    "dask-image ==2024.5.3",
    "ngff-zarr",
    # Mosaic CZI reading. Both are pure-Python wheels, so micropip installs
    # them unchanged; czifile reads through tifffile's FileHandle, and
    # multiview_stitcher.io imports tifffile itself.
    #
    # imagecodecs is deliberately absent: it is a C extension with no
    # WebAssembly build, which limits the browser to uncompressed CZI files.
    # That is also why czifile stays at 2019.7.2.3 here - it treats
    # imagecodecs as optional, while the 2026 releases import it
    # unconditionally and would not load at all.
    "czifile ==2019.7.2.3",
    "tifffile",
    # elastix as WebAssembly, the browser's only route to a registration
    # beyond a translation. Pure-Python wheels: the pipeline itself is a
    # WebAssembly module fetched on first use.
    "itkwasm-elastix",
]
gpu-cuda12 = [
    "cupy-cuda12x",
]
distributed = [
    "distributed",
    "dask-jobqueue",
    "bokeh",
]


[tool.setuptools]
license-files = [
    "LICENSE",
]

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.setuptools.package-data]
"*" = [
    "*.md",
    "*.yaml",
    "test-datasets/*"
]


[tool.black]
line-length = 79
target-version = ['py310', 'py311', 'py312', 'py313']
force-exclude = '''
    src/multiview_stitcher/czifile_patch.py
    '''


[tool.ruff]
line-length = 79
select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long. let black handle this
    "UP006", "UP007", # type annotation. As using magicgui require runtime type annotation then we disable this.
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
    "src/multiview_stitcher/_tests/quickstart",
]

target-version = "py39"
fix = true

[tool.pytest.ini_options]

markers = [ # https://docs.pytest.org/en/stable/how-to/mark.html
    "private_data: marks tests as requiring private data (deselect with '-m \"not private_data\"')",
]
